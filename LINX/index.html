<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Linx</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div class="vitrine">

        <div class="card-produto">
            <img src="img/Oversised.png" alt="Camiseta Oversized" class="imagem-produto">
            <h2 class="nome-produto">Camiseta Oversized</h2>

            <div class="variacoes">
                <label>Selecione a cor:</label>
                <select class="variacao-cor">
                    <option value="">Escolha a cor</option>
                    <option value="Preto">Preto</option>
                    <option value="Branco">Branco</option>
                    <option value="Azul">Azul</option>
                </select>
            </div>

            <div class="head">
                <p class="wd-product-price-description sale-price">
                    De: <span>R$ 129,90</span>
                </p>
            </div>

            <div class="box-preco-a-vista">
                <div class="col-dois">
                    <span class="tag-desconto" data-desconto-porcentagem="10">10% OFF no PIX</span>
                </div>
                <div class="valor-final">
                    Por: <span class="preco-a-vista"></span>
                </div>
            </div>

            <button class="btn-selecionar">Comprar</button>
            <p class="resultado"></p>
        </div>

        <div class="card-produto">
            <img src="img/slimFit.png" alt="Camiseta Slim Fit" class="imagem-produto">
            <h2 class="nome-produto">Camiseta Slim Fit</h2>

            <div class="variacoes">
                <label>Selecione a cor:</label>
                <select class="variacao-cor">
                    <option value="">Escolha a cor</option>
                    <option value="Preto">Preto</option>
                    <option value="Branco">Branco</option>
                    <option value="Azul">Azul</option>
                </select>
            </div>

            <div class="head">
                <p class="wd-product-price-description sale-price">
                    De: <span>R$ 119,90</span>
                </p>
            </div>

            <div class="box-preco-a-vista">
                <div class="col-dois">
                    <span class="tag-desconto" data-desconto-porcentagem="10">10% OFF no PIX</span>
                </div>
                <div class="valor-final">
                    Por: <span class="preco-a-vista"></span>
                </div>
            </div>

            <button class="btn-selecionar">Comprar</button>
            <p class="resultado"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
